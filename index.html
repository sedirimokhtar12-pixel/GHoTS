<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GHoST</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #00ff88;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    nav {
      background: #111;
      padding: 18px;
      border-bottom: 1px solid #00ff88;
    }

    nav a {
      color: #00ff88;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
    }

    nav a:hover {
      color: white;
    }

    .container {
      max-width: 700px;
      margin: 100px auto;
      padding: 30px;
    }

    h1 {
      font-size: 60px;
    }

    p {
      color: #ccc;
      font-size: 20px;
    }

    input {
      padding: 12px;
      width: 250px;
      background: #111;
      color: white;
      border: 1px solid #00ff88;
      border-radius: 5px;
    }

    button {
      padding: 12px 20px;
      margin-left: 5px;
      background: #00ff88;
      color: black;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    #message {
      margin-top: 30px;
      font-size: 22px;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="container">
    <h1>GHoST 👻</h1>

    <p>Welcome to my digital space.</p>

    <input id="nameInput" type="text" placeholder="Enter your name">

    <button onclick="sayHello()">Enter</button>

    <div id="message"></div>
  </div>

  <script>
    function sayHello() {
      const name = document.getElementById("nameInput").value;

      document.getElementById("message").textContent =
        name ? "Welcome, " + name + " 👻" : "Welcome, Guest 👻";
    }
  </script>

</body>
</html>
