<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact GHoST</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: #00ff88;
      font-family: Arial, sans-serif;
    }

    nav {
      background: #111;
      padding: 18px;
      text-align: center;
      border-bottom: 1px solid #00ff88;
    }

    nav a {
      color: #00ff88;
      text-decoration: none;
      margin: 0 20px;
      font-weight: bold;
    }

    nav a:hover {
      color: white;
    }

    .container {
      max-width: 600px;
      margin: 70px auto;
      padding: 30px;
    }

    h1 {
      text-align: center;
      font-size: 45px;
    }

    p {
      text-align: center;
      color: #ccc;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      background: #111;
      color: white;
      border: 1px solid #00ff88;
      border-radius: 5px;
      font-size: 16px;
    }

    textarea {
      height: 150px;
      resize: vertical;
    }

    button {
      display: block;
      margin: 25px auto 0;
      padding: 12px 30px;
      background: #00ff88;
      color: #000;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #00cc6a;
    }

    #status {
      margin-top: 20px;
      color: #00ff88;
    }
  </style>
</head>

<body>

  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="container">

    <h1>Contact GHoST 👻</h1>

    <p>Send a message using the form below.</p>

    <form id="contactForm">

      <label for="name">Name</label>
      <input id="name" type="text" required>

      <label for="email">Email</label>
      <input id="email" type="email" required>

      <label for="message">Message</label>
      <textarea id="message" required></textarea>

      <button type="submit">Send Message</button>

    </form>

    <p id="status"></p>

  </div>

  <script>
    document.getElementById("contactForm").addEventListener("submit", function(event) {
      event.preventDefault();

      document.getElementById("status").textContent =
        "Demo only — the message was not sent.";
    });
  </script>

</body>
</html>
